# DB + App + Tests en un entorno reproducible.
#   docker compose up --build              -> base de datos + API en http://localhost:8000/docs
#   docker compose run --rm tests          -> pruebas con cobertura contra un PostgreSQL aparte
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edutech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edutech}
      POSTGRES_DB: ${POSTGRES_DB:-edutech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edutech} -d ${POSTGRES_DB:-edutech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    profiles: ["tests"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: edutech_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d edutech_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-edutech}:${POSTGRES_PASSWORD:-edutech}@db:5432/${POSTGRES_DB:-edutech}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    profiles: ["tests"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@db-test:5432/edutech_test
    depends_on:
      db-test:
        condition: service_healthy
    command: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

volumes:
  pgdata:
